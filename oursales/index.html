<style>
/* Layout: field-sales console — sticky header with breadcrumb, tile grids that drill down area → branch → rep → report */
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--sunk:#E9EDF1;--ink:#14202B;--muted:#5B6976;--line:#D7DEE5;
  --accent:#1D5C8F;--accent-ink:#FFFFFF;--signal:#E0A100;
  --ok:#1E7B3E;--ok-bg:#E3F3E8;--warn:#8A5A00;--warn-bg:#FBF0D6;--bad:#B42318;--bad-bg:#FCE7E4;--info:#1F5F99;--info-bg:#E2EEF9;--done:#5B6976;--done-bg:#ECEFF2;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;--r:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10161C;--surface:#18212A;--sunk:#131A21;--ink:#E4EBF1;--muted:#93A2AF;--line:#2A3641;
  --accent:#6BAEE4;--accent-ink:#071827;--signal:#F0B528;
  --ok:#6CD08E;--ok-bg:#16301F;--warn:#F0C25A;--warn-bg:#33280F;--bad:#FF8A7E;--bad-bg:#3A1714;--info:#86BDF0;--info-bg:#132A40;--done:#93A2AF;--done-bg:#202A33;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
#hgrip{height:16px;cursor:ns-resize;touch-action:none;user-select:none;position:relative;display:flex;align-items:center}
#hgrip::before{content:"";display:block;width:100%;height:4px;background:linear-gradient(90deg,var(--accent),var(--signal))}
#hgrip::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.18);background-image:repeating-linear-gradient(0deg,transparent 0 3px,var(--muted) 3px 4px);background-size:28px 9px;background-repeat:no-repeat;background-position:center}
#hgrip:hover::after{border-color:var(--accent)}
header.top>.wrap{overflow:hidden;will-change:max-height;contain:paint;display:flex;flex-direction:column;justify-content:flex-end}header.top>.wrap>*{flex-shrink:0}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;margin-inline-end:auto;min-width:0}
.brand b{font-family:var(--display);font-size:20px}
.brand span{font-size:12px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.who img{width:28px;height:28px;border-radius:50%}
.chip{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:10px;font-size:14px}
.crumbs button{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:2px 4px}
.crumbs span.sep{color:var(--muted)}
.crumbs b{font-weight:700}
main{padding-block:18px 60px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f>*{color:var(--ink);font-size:15px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
a.mlink{color:inherit;text-decoration:none;display:block}a.mlink:hover{color:var(--accent);text-decoration:underline}
.kpi-btn{cursor:pointer;transition:box-shadow .15s,border-color .15s}.kpi-btn:hover,.kpi-btn:focus-visible{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.08);outline:none}
.kpi>span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile .t{display:flex;align-items:center;gap:10px}
.tile .t b{font-family:var(--display);font-size:17px}
.tile .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.tile .meta div{display:flex;flex-direction:column;gap:0}
.tile .meta div>span{color:var(--muted);font-size:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;flex:none;font-size:16px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.ico{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;font-size:14px;position:relative}
.ico:hover{border-color:var(--accent)}
.ico:focus-visible{outline:2px solid var(--accent)}
.ico svg{width:30px;height:30px;color:var(--accent)}
.ico .badge{position:absolute;top:6px;inset-inline-start:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:1.6}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.s-bad{background:var(--bad-bg);color:var(--bad)}.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-info{background:var(--info-bg);color:var(--info)}.s-done{background:var(--done-bg);color:var(--done)}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;vertical-align:top}
th{background:var(--sunk);position:sticky;top:0;z-index:1;font-weight:700;font-size:12.5px}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--sunk)}
tr.grp td{background:var(--info-bg);color:var(--info);font-weight:700}
tr.r-strong td{background:color-mix(in srgb,var(--ok-bg) 70%,transparent)}
tr.r-good td{background:color-mix(in srgb,var(--info-bg) 70%,transparent)}
tr.r-watch td{background:color-mix(in srgb,var(--warn-bg) 70%,transparent)}
tr.r-weak td{background:color-mix(in srgb,var(--bad-bg) 70%,transparent)}
tr.r-off td{color:var(--muted)}
td.wrap{white-space:normal;min-width:200px}
.neg{color:var(--bad)}
.alertbar{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.alertbar .row{gap:6px}
.alertbar button{all:unset;cursor:pointer;border:1px solid currentColor;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.agebar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.agebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:20;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);max-width:520px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.score{font-family:var(--display);font-size:34px;font-weight:700}
.meter{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.fvb{border:1px solid var(--line,#ccd);background:transparent;border-radius:6px;padding:1px 6px;cursor:pointer;font-size:14px;margin-inline-end:4px;vertical-align:middle}.fvb:hover{background:var(--info-bg,#eef)}
</style>

<script>/* the line under the top bar can be dragged up/down to make the top bar smaller or bigger (remembered on this device) */
(()=>{const g=document.getElementById("hgrip"),w=document.getElementById("hwrap");const K="hdrH";
  const set=h=>{if(h==null){w.style.maxHeight="";return}w.style.maxHeight=Math.max(0,h)+"px"};
  try{const v=localStorage.getItem(K);if(v!==null&&v!=="")set(+v)}catch(e){}
  /* smooth drag: one layout change per frame, no scroll anchoring jumps, no text selection while dragging */
  let y0=0,h0=0,full=0,drag=false,want=null,raf=0;
  const apply=()=>{raf=0;if(want==null)return;const h=Math.round(want);w.style.maxHeight=(h>=full-1?full:h)+"px"};
  g.addEventListener("pointerdown",e=>{drag=true;y0=e.clientY;h0=w.getBoundingClientRect().height;full=w.scrollHeight;w.style.maxHeight=h0+"px";
    document.documentElement.style.overflowAnchor="none";document.body.style.userSelect="none";document.body.style.cursor="ns-resize";g.setPointerCapture(e.pointerId);e.preventDefault()});
  g.addEventListener("pointermove",e=>{if(!drag)return;want=Math.min(full,Math.max(0,h0+(e.clientY-y0)));if(!raf)raf=requestAnimationFrame(apply)});
  const end=()=>{if(!drag)return;drag=false;if(raf){cancelAnimationFrame(raf);apply()}document.documentElement.style.overflowAnchor="";document.body.style.userSelect="";document.body.style.cursor="";
    const h=parseFloat(w.style.maxHeight);if(h>=full-1)w.style.maxHeight="";try{localStorage.setItem(K,h>=full-1?"":Math.round(h))}catch(e){}};
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
  g.addEventListener("dblclick",()=>{const shut=w.style.maxHeight&&parseFloat(w.style.maxHeight)<8;set(shut?null:0);try{localStorage.setItem(K,shut?"":0)}catch(e){}});
})();</script>

<script>/*I18N_START*/

function mzCalc(y){const M=S.mz,ms=[];const lastM=(M.asof||"").slice(0,7);for(let m=1;m<=12;m++){const k=y+"-"+String(m).padStart(2,"0");if(lastM&&k>lastM)break;ms.push(k)}

}

  (p.rows||[]).forEach(r=>{if(r.sec){cur=null;out.push(r);return}const k=String(r.ref||"").trim().toUpperCase();

    if(i>=0){let j=i+1;while(j<out.length&&!out[j].sec)j++;out.splice(j,0,...mv[k])}
    else{let e=out.findIndex(r=>r.sec==="ENCLOSURE");if(e<0)e=out.length;out.splice(e,0,{sec:k},...mv[k])}});p.rows=out});return panels}

    const v={reason:"error",by2:F.get("by2")||"",note:(F.get("note")||"").trim(),at:new Date().toISOString(),uid:S.uid};

function cItemLib(){if(S._cil&&S._cilN===Object.keys(S.calc||{}).length)return S._cil;const L={};const take=rows=>(rows||[]).forEach(r=>{if(!r.sec&&String(r.desc||"").trim())L[String(r.desc).trim()]=r});

function cAddToSec(p,sec,row){const R=p.rows=p.rows||[];let i=R.findIndex(r=>r.sec===sec);
  if(i<0){const ord=k=>{const j=C_SEC.indexOf(k);return j<0?99:j};let at=R.findIndex(r=>r.sec&&ord(r.sec)>ord(sec));if(at<0)at=R.length;R.splice(at,0,{sec},row);return}
  let j=i+1;while(j<R.length&&!R[j].sec)j++;R.splice(j,0,row)}

  const [y,m]=k.split("-").map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>k+"-"+String(i+1).padStart(2,"0"))};

function targetsDaily(uid,date,role){
  if(!TGT_ROLES.includes(role))return "";
  const td='style="border:1px solid #999;padding:5px 7px"',th='style="border:1px solid #999;padding:5px 7px;background:#D9E1F2"';
  const tb=(h,rows)=>`<table style="width:100%;border-collapse:collapse;margin-top:4px"><tr>${h.map(x=>`<th ${th}>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td ${td}>${c}</td>`).join("")}</tr>`).join("")}</table>`;
  const block=(k,title)=>{const T=tgtOf(uid,k);
    if(!T)return `<div style="font-weight:700;margin-top:8px">${title} — ${esc(perLabel(k))}</div><div style="color:#B42318;font-weight:700">لم تُحدَّد الأهداف.</div>`;
    const reps=Object.keys(T.reps||{}).filter(i=>R(i));
    const tasks=(T.tasks||[]).filter(t=>t.due===date||(t.doneAt&&dayOf(t.doneAt)===date)||(!t.done&&t.due&&t.due<date));
    return `<div style="font-weight:700;margin-top:8px">${title} — ${esc(perLabel(k))}</div>
     ${reps.length?tb(["المندوب","هدف البيع","المحقق","%","هدف التحصيل","المحقق","%"],reps.map(i=>{const t=T.reps[i],a=repAch(i,k);return [`<b>${esc(R(i).name)}</b>`,fmt(t.sale),fmt(a.sale),t.sale?pct(a.sale/t.sale):"—",fmt(t.col),fmt(a.col),t.col?pct(a.col/t.col):"—"]})):""}
     ${(T.custs||[]).length?tb(["العميل","المندوب","الهدف","ملاحظة"],T.custs.map(c=>[`<b>${esc(c.name)}</b>`,esc(R(c.rep)?R(c.rep).name:""),fmt(c.amt),esc(c.note||"")])):""}
     ${(T.elecs||[]).length?tb(["الكهربائي","الهدف","تواصل خلال الفترة"],T.elecs.map(x=>{const e=S.elec.find(z=>z.id===x.id);return [`<b>${esc(x.name)}</b>`,esc(x.goal),e?elVisits(e,k):"—"]})):""}
     <div style="margin-top:4px"><b>المهام:</b>${tasks.length?`<ul style="margin:4px 0">${tasks.map(t=>`<li>${t.done?"✅":"⬜"} ${esc(t.text)}${t.due?` <small>(موعد ${fd(t.due)})</small>`:""}${t.done?` <small>— تم ${esc(tmFmt(t.doneAt))}</small>`:t.due&&t.due<date?' <small style="color:#B42318">— متأخرة</small>':""}</li>`).join("")}</ul>`:" لا توجد مهام لهذا اليوم"}</div>`};
  return `<div style="background:#8B1A1A;color:#fff;font-weight:700;padding:6px 10px;margin:14px 0 6px;font-size:15px">٥. الأهداف</div>${block(weekOf(date),"الهدف الأسبوعي")}${block(monthOf(date),"الهدف الشهري")}`;
}

let _libs=null;
function loadLibs(){if(_libs)return _libs;const ld=src=>new Promise((ok,no)=>{const x=document.createElement("script");x.src=src;x.onload=ok;x.onerror=no;document.head.append(x)});
  _libs=Promise.all([ld("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),ld("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]).catch(e=>{_libs=null;throw e});return _libs}
async function chartPdf(el,name,btn){
  let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
  if(!dl){toast("حفظ الملفات يعمل عند فتح التطبيق من رابطه");return}
  if(btn){btn.disabled=true;btn.textContent="جاري التجهيز…"}
  try{await loadLibs();const c=await html2canvas(el,{scale:hqScale(el),backgroundColor:"#ffffff",useCORS:true});
    const {jsPDF}=window.jspdf;const land=c.width>=c.height;const pdf=new jsPDF({orientation:land?"l":"p",unit:"mm",format:"a4"});
    const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
    if(!land&&c.height/c.width>(H-16)/(W-16)*1.15){const r=(W-16)/c.width,pagePx=Math.floor((H-16)/r);
      for(let y=0,pg=0;y<c.height;y+=pagePx,pg++){const part=document.createElement("canvas");part.width=c.width;part.height=Math.min(pagePx,c.height-y);part.getContext("2d").drawImage(c,0,y,c.width,part.height,0,0,c.width,part.height);
        if(pg)pdf.addPage();pdf.addImage(part.toDataURL("image/png"),"PNG",8,8,W-16,part.height*r)}}
    else{const r=Math.min((W-16)/c.width,(H-16)/c.height);const w=c.width*r,h=c.height*r;pdf.addImage(c.toDataURL("image/png"),"PNG",(W-w)/2,8,w,h)}
    await dl.save({filename:name.replace(/[\\/:*?"<>|]/g,"-")+".pdf",data:pdf.output("blob")});toast("تم حفظ ملف PDF — افتحه للطباعة")}
  catch(e){if(!(e&&e.code==="declined"))toast("تعذّر إنشاء ملف PDF")}
  finally{if(btn){btn.disabled=false;btn.textContent="🖨️ طباعة / PDF"}}
}
const pdfBtn=id=>`<button class="btn sm" data-pdf="${id}">🖨️ طباعة / PDF</button>`;
async function saveBlob(blob,name){let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});return}catch(e){if(e&&e.code==="declined")return}}
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const waPh=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("05"))d="966"+d.slice(1);else if(d.startsWith("5")&&d.length===9)d="966"+d;return d.length>=11?d:""};

  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:txt});return}catch(e){if(e&&e.name==="AbortError")return}}
  await saveBlob(file,file.name);toast("نزل الملف — اسحبه لمحادثة واتساب");window.open("https://wa.me/"+waPh(phone)+"?text="+encodeURIComponent(txt),"_blank")}
async function elCanvas(el){await loadLibs();return html2canvas(el,{scale:hqScale(el),backgroundColor:"#ffffff",useCORS:true})}
async function pdfBlobOf(el){const c=await elCanvas(el);const {jsPDF}=window.jspdf;const land=c.width>=c.height;const pdf=new jsPDF({orientation:land?"l":"p",unit:"mm",format:"a4"});
  const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
  if(!land&&c.height/c.width>(H-16)/(W-16)*1.15){const r=(W-16)/c.width,pagePx=Math.floor((H-16)/r);
    for(let y=0,pg=0;y<c.height;y+=pagePx,pg++){const part=document.createElement("canvas");part.width=c.width;part.height=Math.min(pagePx,c.height-y);part.getContext("2d").drawImage(c,0,y,c.width,part.height,0,0,c.width,part.height);
      if(pg)pdf.addPage();pdf.addImage(part.toDataURL("image/png"),"PNG",8,8,W-16,part.height*r)}}
  else{const r=Math.min((W-16)/c.width,(H-16)/c.height);const w=c.width*r,h=c.height*r;pdf.addImage(c.toDataURL("image/png"),"PNG",(W-w)/2,8,w,h)}

const fmtN=n=>(Math.abs(n||0)<0.5?0:Number(n||0)).toLocaleString("en-US",{maximumFractionDigits:0});
/* pie as SVG: only the % inside each slice, slices under 3% unlabeled */
function pieSvg(vals,cols,txt,size=360){
  const t=sum(vals.map(v=>Math.max(0,v)));if(!t)return `<div style="padding:40px;color:#666">لا توجد قيم</div>`;
  const cx=size/2,cy=size/2,r=size/2-6;let a=-Math.PI/2;
  const parts=vals.map((v,i)=>{v=Math.max(0,v);if(!v)return"";const f=v/t,b=a+f*2*Math.PI;
    const path=f>=.9999?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${cols[i]}" stroke="#fff" stroke-width="1.5"/>`:`<path d="M${cx} ${cy} L${cx+r*Math.cos(a)} ${cy+r*Math.sin(a)} A${r} ${r} 0 ${f>.5?1:0} 1 ${cx+r*Math.cos(b)} ${cy+r*Math.sin(b)} Z" fill="${cols[i]}" stroke="#fff" stroke-width="1.5"/>`;
    const m=(a+b)/2,lr=f>=.9999?0:r*.62;const lab=f>=.03?`<text x="${cx+lr*Math.cos(m)}" y="${cy+lr*Math.sin(m)}" text-anchor="middle" dominant-baseline="central" font-family="Calibri,Arial,sans-serif" font-size="${size/20}" font-weight="700" fill="${txt[i]}">${Math.round(f*100)}%</text>`:"";a=b;return path+lab}).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="max-width:100%;height:auto" role="img">${parts}</svg>`;
}

function itemsView(app,n){
  const sc=n.scope;const ids=sc.t==="rep"?[sc.id]:repsOfBranch(sc.id);const who=sc.t==="rep"?R(sc.id).name:brLabel(sc.id);
  const y0=S.D.asof.slice(0,4)+"-01-01";const a=n.from||y0,b=n.to||S.D.asof;const P=S.D.products;
  const agg={};ids.forEach(i=>(R(i).items||[]).forEach(([d,pid,amt,q])=>{if(d<a||d>b)return;const o=agg[pid]=agg[pid]||[0,0];o[0]+=amt;o[1]+=q}));
  const its=Object.entries(agg).map(([pid,[amt,q]])=>{const p=P[pid]||["",pid,"أخرى","","",""];return {pid,code:p[0],name:p[1],fam:p[2],sub:p[4]||p[5]||"أخرى",amt,q}});

  const tile=(k,o,icon,attr)=>`<button class="ico" ${attr}="${esc(k)}" style="padding:16px 10px;gap:6px">${psvg(icon)}<b style="font-size:15px">${esc(k)}</b><span class="num" style="font-size:17px;font-weight:700">${fmt(o.amt)}</span><span class="small muted" style="font-weight:500">${pct(tot?o.amt/tot:0)} · ${o.n} صنف · كمية ${fmt(o.q)}</span></button>`;
  let body;

    ${G.map(g=>{const isO=op[g.k];const L=its.filter(x=>x.fam===g.k).sort((x,y)=>y.amt-x.amt);

  const setR=()=>{let x=app.querySelector("#f1").value||y0,t=app.querySelector("#f2").value||S.D.asof;if(x>t)[x,t]=[t,x];n.from=x;n.to=t;render()};

  app.querySelectorAll("[data-fam]").forEach(e=>e.onclick=()=>{n.fam=e.dataset.fam;n.sub=null;if(n.fam==="__total"){n.from=y0;n.to=S.D.asof}render()});
  app.querySelectorAll("[data-sub]").forEach(e=>e.onclick=()=>{n.sub=e.dataset.sub;render()});
  app.querySelectorAll("[data-tg]").forEach(e=>e.onclick=()=>{const o={...(S.opt.open||{})};if(o[e.dataset.tg])delete o[e.dataset.tg];else o[e.dataset.tg]=1;S.opt.open=o;render()});
  const ta=app.querySelector("#tall");if(ta)ta.onclick=()=>{const G=[...new Set(its.map(x=>x.fam))];S.opt.open=Object.keys(S.opt.open||{}).length?{}:Object.fromEntries(G.map(g=>[g,1]));render()};
  app.querySelectorAll("[data-lv]").forEach(e=>e.onclick=()=>{if(e.dataset.lv==="0"){n.fam=null;n.sub=null}else n.sub=null;render()});
  const sq=app.querySelector("#sq");sq.oninput=()=>{S.opt.q=sq.value;render();const e=$("#sq");e.focus();e.setSelectionRange(e.value.length,e.value.length)};

const DOUT=[["closed","مقفل",/مقفل|مغلق|closed|switch/i],["oos","خارج الخدمة",/خارج الخدمة|out of service/i],["wrong","الرقم غلط",/غلط|خطأ|wrong|غير صحيح/i],["noans","لا يرد",/لا يرد|ما رد|مارد|no answer|لم يرد|busy|مشغول/i],["nowork","لا يوجد شغل حالي — متابعة لاحقاً",/ما ?في شغل|مافي شغل|لا يوجد شغل|لايوجد شغل|الأسبوع القادم|لاحق/i],["interest","مهتم / طلب عرض",/مهتم|عرض|سعر|interested/i],["order","تم الطلب / البيع",/طلب|اشترى|بيع|order/i],["done","تم التواصل",/./]];
const callOutcome=v=>{const t=(v.st||"")+" "+(v.note||"");if(/no answer|لا يرد/i.test(v.st||""))return"noans";if(/الرقم غلط/.test(v.st||""))return"wrong";const o=DOUT.find(o=>o[2].test(t));return o?o[0]:"done"};
const todayR=()=>new Date(Date.now()+3*3600e3).toISOString().slice(0,10);
const dayOf=at=>at?new Date(new Date(at).getTime()+3*3600e3).toISOString().slice(0,10):"";
function dailyAuto(uid,date,brs){
  const reps=Object.keys(S.D.reps).filter(i=>brs.includes(brOf(i)));
  const calls=[],updates=[],added=[],approvals=[];
  S.elec.forEach(e=>{(e.visits||[]).forEach(v=>{if(v.by===uid&&(v.d===date||dayOf(v.at)===date))calls.push({e,v,o:callOutcome(v)})});
    (e.updates||[]).forEach(u=>{if(u.by===uid&&dayOf(u.at)===date)updates.push({e,u});if(u.appBy===uid&&u.by!==uid&&dayOf(u.appAt)===date)approvals.push({e,u})});
    (e.pend||[]).forEach(u=>{if(u.by===uid&&dayOf(u.at)===date)updates.push({e,u,pend:true})});
    if(e.by===uid&&dayOf(e.createdAt)===date)added.push(e);
    if(e.movedBy===uid&&dayOf(e.movedAt)===date)updates.push({e,u:{note:"نقل لمندوب: "+(R(String(e.rep))?R(String(e.rep)).name:""),ch:{}}})});
  const custNotes=[],targets=[];const acts=(S.log||[]).filter(l=>l.by===uid&&l.d===date).sort((a,b)=>a.at.localeCompare(b.at));
  Object.entries(S.cust||{}).forEach(([cid,x])=>{(x.notes||[]).forEach(n=>{if(n.by===uid&&dayOf(n.at)===date)custNotes.push({cid,n})});if(x.targetBy===uid&&dayOf(x.targetAt)===date)targets.push({cid,t:x.target})});
  const cname=cid=>{for(const i in S.D.reps){const c=R(i).customers.find(c=>String(c[0])===String(cid));if(c)return [c[1],R(i).name]}return [cid,""]};
  const repDay=reps.map(i=>({i,sale:(R(i).dSale||{})[date]||0,col:(R(i).dCol||{})[date]||0,k:R(i).kpi,el:calls.filter(c=>String(c.e.rep)===i).length,cn:custNotes.filter(c=>cname(c.cid)[1]===R(i).name).length}));
  const byReg={};calls.forEach(c=>{const r=c.e.region||"بدون منطقة";const o=byReg[r]=byReg[r]||{n:0,o:{}};o.n++;o.o[c.o]=(o.o[c.o]||0)+1});
  return {reps,calls,updates,added,approvals,custNotes,targets,cname,repDay,byReg,acts,dataAsOf:S.D.asof};
}

    ${NT.slice(0,400).map(o=>`<tr><td class="small">${esc(tmFmt(o.n.at))}</td><td class="wrap"><b>${esc(o.name)}</b></td>${many?`<td>${esc(R(o.rep).name)}</td>`:""}<td>${esc(nk(o.n))}</td><td class="wrap">${esc(o.n.note)}</td><td>${o.n.amt?fmtN(o.n.amt)+(o.n.due?`<div class="small">${fd(o.n.due)}${o.n.due<todayR()?' <span class="pill s-bad">فات الموعد</span>':""}</div>`:""):"—"}</td><td class="small">${esc(pname(o.n.by))}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">لا توجد ملاحظات مكتوبة على عملاء هذا النطاق.</div>'}</div>`:`
   <div class="card">${rows.length?`<div class="tbl"><table><thead><tr><th>العميل</th>${many?"<th>المندوب</th>":""}<th>التصنيف</th><th class="n">أيام بدون طلب</th><th class="n">أيام بدون تحصيل</th><th class="n">الرصيد</th><th>التنبيه</th><th>آخر ملاحظة</th></tr></thead><tbody>
   ${rows.map(a=>`<tr class="${RCLS[a[7]]}"><td class="wrap"><b>${esc(a[1])}</b></td>${many?`<td>${esc(R(a[8]).name)}</td>`:""}<td>${esc(a[7])}</td><td class="n">${a[2]==null?"لم يشترِ هذه الفترة":a[2]}</td><td class="n">${a[3]==null?"—":a[3]}</td><td class="n">${fmt(a[4])}</td><td>${a[5]?'<span class="pill s-warn">بدون طلب</span> ':""}${a[6]?'<span class="pill s-bad">بدون تحصيل</span>':""}</td><td class="wrap" style="min-width:200px">${noteCell(lastN[String(a[0])])}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">لا توجد تنبيهات.</div>'}
   <p class="small muted" style="margin:0">العميل: تنبيه إذا مر ${d.custDays} يوم بدون فاتورة، أو ${d.custDays} يوم بدون سداد وعليه رصيد. المندوب: تنبيه للمديرة ومدير المبيعات والنائب إذا مر ${d.repDays} أيام بدون بيع أو تحصيل. مرتبة من الأخطر. «آخر ملاحظة» = آخر ملاحظة مكتوبة على العميل في «متابعة العملاء».</p></div>`}`;
  box.querySelectorAll("[data-af]").forEach(b=>b.onclick=()=>{S.opt.af=b.dataset.af;render()});
}

i18nInit();
boot();
</script>

<script data-shield="1">
/* حماية من التصوير: علامة مائية باسم المستخدم والوقت فوق الشاشة + تغبيش لمن يطلع من التطبيق أو يضغط مفتاح لقطة الشاشة */
(()=>{const wm=document.createElement("div");wm.id="wm";document.body.append(wm);let last="";
 const draw=()=>{try{let who="";try{who=((document.querySelector("#acctbar span")||{}).textContent||"").replace("👤","").trim();if(!who&&S.uid){const n=pname(S.uid);if(n!=="مستخدم")who=n}}catch(x){}const d=new Date();const t=d.toLocaleDateString("en-GB")+" "+d.toTimeString().slice(0,5);
  const txt=(who?who+" · ":"")+t;const dark=matchMedia("(prefers-color-scheme: dark)").matches||document.documentElement.dataset.theme==="dark";const key=txt+dark;if(key===last)return;last=key;
  const col=dark?"rgba(255,255,255,.08)":"rgba(0,0,0,.08)";const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220"><text x="220" y="115" fill="${col}" font-size="16" font-family="sans-serif" font-weight="700" text-anchor="middle" transform="rotate(-20 220 110)">${e(txt)}</text></svg>`;
  wm.style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`}catch(e){}};
 draw();setInterval(draw,15000);
 let tm=0;const sh=ms=>{document.body.classList.add("shield");clearTimeout(tm);if(ms)tm=setTimeout(()=>document.body.classList.remove("shield"),ms)};
 const un=()=>{clearTimeout(tm);document.body.classList.remove("shield")};
 document.addEventListener("visibilitychange",()=>document.hidden?sh():un());
 addEventListener("blur",()=>sh());addEventListener("focus",un);addEventListener("pagehide",()=>sh());
 addEventListener("keydown",e=>{if(e.metaKey&&e.shiftKey&&/^Digit[345]$/.test(e.code)||(e.shiftKey&&e.code==="KeyS"&&(e.metaKey||e.getModifierState("OS"))))sh(2500)},true);
 addEventListener("keyup",e=>{if(e.key==="PrintScreen"||e.key==="Snapshot"){sh(2500);try{navigator.clipboard.writeText("")}catch(x){}}},true);
 addEventListener("beforeprint",()=>sh());addEventListener("afterprint",un);
})();
