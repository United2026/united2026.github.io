<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة المبيعات — يونايتد</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: field-sales console — sticky header with breadcrumb, tile grids that drill down area → branch → rep → report */
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--sunk:#E9EDF1;--ink:#14202B;--muted:#5B6976;--line:#D7DEE5;
  --accent:#1D5C8F;--accent-ink:#FFFFFF;--signal:#E0A100;
  --ok:#1E7B3E;--ok-bg:#E3F3E8;--warn:#8A5A00;--warn-bg:#FBF0D6;--bad:#B42318;--bad-bg:#FCE7E4;--info:#1F5F99;--info-bg:#E2EEF9;--done:#5B6976;--done-bg:#ECEFF2;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;--r:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10161C;--surface:#18212A;--sunk:#131A21;--ink:#E4EBF1;--muted:#93A2AF;--line:#2A3641;
  --accent:#6BAEE4;--accent-ink:#071827;--signal:#F0B528;
  --ok:#6CD08E;--ok-bg:#16301F;--warn:#F0C25A;--warn-bg:#33280F;--bad:#FF8A7E;--bad-bg:#3A1714;--info:#86BDF0;--info-bg:#132A40;--done:#93A2AF;--done-bg:#202A33;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header.top::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--accent),var(--signal))}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;margin-inline-end:auto;min-width:0}
.brand b{font-family:var(--display);font-size:20px}
.brand span{font-size:12px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.who img{width:28px;height:28px;border-radius:50%}
.chip{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:10px;font-size:14px}
.crumbs button{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:2px 4px}
.crumbs span.sep{color:var(--muted)}
.crumbs b{font-weight:700}
main{padding-block:18px 60px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f>*{color:var(--ink);font-size:15px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi>span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile .t{display:flex;align-items:center;gap:10px}
.tile .t b{font-family:var(--display);font-size:17px}
.tile .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.tile .meta div{display:flex;flex-direction:column;gap:0}
.tile .meta div>span{color:var(--muted);font-size:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;flex:none;font-size:16px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.ico{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;font-size:14px;position:relative}
.ico:hover{border-color:var(--accent)}
.ico:focus-visible{outline:2px solid var(--accent)}
.ico svg{width:30px;height:30px;color:var(--accent)}
.ico .badge{position:absolute;top:6px;inset-inline-start:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:1.6}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.s-bad{background:var(--bad-bg);color:var(--bad)}.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-info{background:var(--info-bg);color:var(--info)}.s-done{background:var(--done-bg);color:var(--done)}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;vertical-align:top}
th{background:var(--sunk);position:sticky;top:0;z-index:1;font-weight:700;font-size:12.5px}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--sunk)}
tr.grp td{background:var(--info-bg);color:var(--info);font-weight:700}
tr.r-strong td{background:color-mix(in srgb,var(--ok-bg) 70%,transparent)}
tr.r-good td{background:color-mix(in srgb,var(--info-bg) 70%,transparent)}
tr.r-watch td{background:color-mix(in srgb,var(--warn-bg) 70%,transparent)}
tr.r-weak td{background:color-mix(in srgb,var(--bad-bg) 70%,transparent)}
tr.r-off td{color:var(--muted)}
td.wrap{white-space:normal;min-width:200px}
.neg{color:var(--bad)}
.alertbar{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.alertbar .row{gap:6px}
.alertbar button{all:unset;cursor:pointer;border:1px solid currentColor;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.agebar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.agebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:20;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);max-width:520px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.score{font-family:var(--display);font-size:34px;font-weight:700}
.meter{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="img/icon-180.png"><meta name="theme-color" content="#1F4E79"><meta name="apple-mobile-web-app-capable" content="yes"></head>
<body>
<header class="top"><div class="wrap">
  <div class="bar"><div class="brand"><b>متابعة المبيعات</b><span id="sub">جاري التحميل…</span></div><div class="who" id="who"></div></div>
  <nav class="crumbs" id="crumbs" aria-label="مسار التنقل"></nav>
</div></header>
<main class="wrap" id="app"><div class="empty">جاري تحميل البيانات…</div></main>
<script>/*I18N_START*/
window.I18N_T=[["التقرير يتبني تلقائياً من حركات المستخدم في التطبيق بهذا اليوم: مكالمات وملاحظات الكهربائيين، تحديثاتهم واعتمادها، ملاحظات العملاء، الأهداف اليدوية، مع بيع وتحصيل المناديب من أودو (بيانات أودو حتى","The report is built automatically from the user's actions in the app on this day: electrician calls and notes, their updates and approvals, customer notes, manual targets, plus reps' sales and collections from Odoo (Odoo data up to","رپورٹ اس دن ایپ میں صارف کی سرگرمیوں سے خودبخود بنتی ہے: الیکٹریشنز کی کالز اور نوٹس، ان کی اپڈیٹس اور منظوری، کسٹمر نوٹس، دستی اہداف، اور اوڈو سے نمائندوں کی فروخت و وصولی (اوڈو ڈیٹا تک","रिपोर्ट इस दिन ऐप में उपयोगकर्ता की गतिविधियों से अपने आप बनती है: इलेक्ट्रीशियन कॉल और नोट्स, उनके अपडेट और स्वीकृति, ग्राहक नोट्स, मैनुअल लक्ष्य, और Odoo से प्रतिनिधियों की बिक्री व वसूली (Odoo डेटा तक"],["الفترة المختارة تكون داخل هذي السنة. النسب من صافي المبيعات بعد المرتجعات وبدون ضريبة (الفواتير ناقص إشعارات المرتجع) للمندوب حسب حقل البائع، ومجموعها يساوي صافي مبيعات المندوب. المراوح الحديد","The selected period must be within this year. Shares are of net sales after returns, excl. VAT (invoices minus credit notes) per rep by the salesperson field, and they add up to the rep's net sales. Steel fans","منتخب مدت اسی سال کے اندر ہو۔ تناسب واپسی کے بعد خالص فروخت سے، بغیر ٹیکس (انوائس منفی کریڈٹ نوٹ) سیلز پرسن فیلڈ کے مطابق، اور ان کا مجموعہ نمائندے کی خالص فروخت کے برابر ہے۔ اسٹیل پنکھے","चुनी गई अवधि इसी साल के भीतर हो। अनुपात रिटर्न के बाद शुद्ध बिक्री से, बिना टैक्स (इनवॉइस घटा क्रेडिट नोट) सेल्सपर्सन फ़ील्ड के अनुसार, और उनका योग प्रतिनिधि की शुद्ध बिक्री के बराबर है। स्टील पंखे"],["البيع صافي بعد المرتجعات وبدون ضريبة، والتحصيل سندات القبض، من 1/1 لليوم. المديونية والمتأخرات (بعد تاريخ الاستحقاق) على المندوب. «أول تعامل»","Sales are net after returns excl. VAT, collections are receipt vouchers, from 1/1 to today. Debt and overdue (past due date) are on the rep. «First deal»","فروخت واپسی کے بعد خالص بغیر ٹیکس، وصولی رسیدیں، 1/1 سے آج تک۔ قرض اور واجب الادا (مقررہ تاریخ کے بعد) نمائندے پر۔ «پہلا لین دین»","बिक्री रिटर्न के बाद शुद्ध बिना टैक्स, वसूली रसीदें, 1/1 से आज तक। बकाया और ओवरड्यू (देय तिथि के बाद) प्रतिनिधि पर। «पहला सौदा»"],["ضعيف أقل من 40. الأهداف من ملف أهداف المناديب (نفس ملف تقرير التصنيف الأسبوعي)؛ المندوب اللي ما له ورقة أهداف يُقيَّم بدون معيار الهدف","Weak below 40. Targets come from the reps' targets file (same as the weekly classification report); a rep without a targets sheet is scored without the target criterion","کمزور 40 سے کم۔ اہداف نمائندوں کی اہداف فائل سے (ہفتہ وار درجہ بندی رپورٹ والی)؛ جس نمائندے کی اہداف شیٹ نہیں اسے ہدف کے معیار کے بغیر جانچا جاتا ہے","कमज़ोर 40 से कम। लक्ष्य प्रतिनिधियों की लक्ष्य फ़ाइल से (साप्ताहिक वर्गीकरण रिपोर्ट वाली); जिस प्रतिनिधि की लक्ष्य शीट नहीं उसे लक्ष्य मानदंड के बिना आंका जाता है"],["في الجوال: «إرسال واتساب» يفتح المشاركة وتختار واتساب والمحادثة. في الكمبيوتر: تنزل الصورة وينفتح واتساب ويب، وتسحب الصورة للمحادثة","On mobile: «Send on WhatsApp» opens sharing; pick WhatsApp and the chat. On a computer: the image downloads and WhatsApp Web opens; drag the image into the chat","موبائل پر: «واٹس ایپ پر بھیجیں» شیئرنگ کھولتا ہے، واٹس ایپ اور چیٹ چنیں۔ کمپیوٹر پر: تصویر ڈاؤن لوڈ ہوگی اور واٹس ایپ ویب کھلے گا، تصویر چیٹ میں کھینچ دیں","मोबाइल पर: «WhatsApp पर भेजें» शेयरिंग खोलता है, WhatsApp और चैट चुनें। कंप्यूटर पर: तस्वीर डाउनलोड होगी और WhatsApp Web खुलेगा, तस्वीर चैट में खींचें"],["مناديب هذه المجموعة يبيعون من مستودع المركز الرئيسي، فالميزانية المعروضة هي ميزانية الرياض (المركز الرئيسي + الرياض + الملز)","Reps in this group sell from the head office warehouse, so the budget shown is Riyadh's (head office + Riyadh + Malaz)","اس گروپ کے نمائندے ہیڈ آفس گودام سے بیچتے ہیں، اس لیے دکھایا گیا بجٹ ریاض کا ہے (ہیڈ آفس + ریاض + ملز)","इस समूह के प्रतिनिधि मुख्य कार्यालय गोदाम से बेचते हैं, इसलिए दिखाया गया बजट रियाद का है (मुख्य कार्यालय + रियाद + मलज़)"],["البيع صافي بعد المرتجعات قبل الضريبة، وبين القوسين صافي عدد الفواتير. التحصيل /* ---------- electricians: imported list (elec.json) + changes and new ones in the shared db ---------- */
function mergeElec(){
  const M=new Map();((S.elecBase&&S.elecBase.items)||[]).forEach(e=>M.set(e.id,e));
  (S.elecDb||[]).forEach(d=>{if(d.deleted)M.delete(d.id);else M.set(d.id,{...(M.get(d.id)||{}),...d})});
  S.elec=[...M.values()];
}
const elecSave=async(e,patch)=>{const {id,...rest}=e;await S.db.doc("elec/"+id).set({...rest,...patch,updatedAt:new Date().toISOString()})};
const elecOf=(ids,br)=>S.elec.filter(e=>ids.includes(String(e.rep))||(br&&!e.rep&&e.br===br));
function elecCounts(ids,br){
  const t=new Date(S.D.asof+"T12:00:00");const day=864e5;
  const m0=S.D.asof.slice(0,8)+"01";
  const w=new Date(t-7*day).toISOString().slice(0,10),q=new Date(t-91*day).toISOString().slice(0,10);
  const L=elecOf(ids,br);const has=(e,from)=>(e.visits||[]).some(v=>v.d&&v.d>=from);
  return {all:L.length,week:L.filter(e=>has(e,w)).length,month:L.filter(e=>has(e,m0)).length,q3:L.filter(e=>has(e,q)).length};
}

  if(p==="c")return [S.opt.tf||t.slice(0,8)+"01",S.opt.tt||t,"فترة محددة"];return ["",t,"كل الفترات"]}
const inR=(d,f,t)=>!!d&&(!f||d>=f)&&d<=t;
function teamStats(u,f,t){
  const mine=x=>u==="all"||x.by===u;const today=todayR();
  const P=projList().filter(mine),Q=quoteList().filter(mine).filter(x=>inR(x.date,f,t));
  const acts=(S.log||[]).filter(l=>(u==="all"?teamIds().includes(l.by):l.by===u)&&inR(l.d,f,t)&&/^(proj|quote)/.test(l.kind||""));
  const open=P.filter(p=>["s1","s2","s3"].includes(p.status));
  const last=(S.log||[]).filter(l=>u==="all"?teamIds().includes(l.by):l.by===u).reduce((m,l)=>l.at>m?l.at:m,"");
  return {P,Q,acts,newP:P.filter(p=>inR(dayOf(p.createdAt),f,t)).length,open:open.length,won:P.filter(p=>p.status==="won").length,lost:P.filter(p=>p.status==="lost").length,
    late:open.filter(p=>p.nextDate&&p.nextDate<today),qv:sum(Q.map(x=>qTotal(x).total)),qwon:sum(Q.filter(x=>x.status==="won").map(x=>qTotal(x).total)),last}}

      <span>متابعات متأخرة</span><b style="color:${s.late.length?"#B42318":"inherit"}">${s.late.length}</b><span>عروض الأسعار (${esc(lbl)})</span><b>${s.Q.length} · ${fmt(s.qv)}</b>

     <h3>سجل الشغل — ${esc(lbl)}</h3>${s.acts.length?s.acts.slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,150).map(l=>`<div style="border-bottom:1px solid var(--line);padding:5px 0"><span class="small muted">${esc(tmFmt(l.at))}${sel==="all"?" — "+esc(pname(l.by)):""} · ${esc(LOGK[l.kind]||l.kind)}</span><div>${esc(l.text||"")}</div></div>`).join(""):'<div class="small muted">لا يوجد شغل مسجّل في هذه الفترة</div>'}
    </div>`}
  return `<div class="row"><div class="seg">${[["w","هذا الأسبوع"],["m","هذا الشهر"],["all","الكل"],["c","فترة محددة"]].map(([k,l])=>`<button data-tper="${k}" aria-pressed="${per===k}">${l}</button>`).join("")}</div>
     ${per==="c"?`<label class="f">من<input type="date" id="tf" value="${esc(f)}"></label><label class="f">إلى<input type="date" id="tt" value="${esc(t)}" max="${todayR()}"></label>`:""}</div>

    <div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${card("all","📊 الإجمالي","الفريق كامل")}${ids.map(u=>card(u,"👤 "+esc(pname(u))+(u===S.uid?" (أنا)":""),esc(ROLES[(S.members[u]||{}).role]||ROLES[myRole()]||""))).join("")}</div>

function wireTeam(app){
  app.querySelectorAll("[data-tper]").forEach(b=>b.onclick=()=>{S.opt.tper=b.dataset.tper;render()});
  app.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{S.opt.tm=S.opt.tm===b.dataset.tm?"":b.dataset.tm;render()});
  const tf=app.querySelector("#tf");if(tf)tf.onchange=()=>{S.opt.tf=tf.value;render()};const tt=app.querySelector("#tt");if(tt)tt.onchange=()=>{S.opt.tt=tt.value;render()};
  const qdd=app.querySelector("#qdd");if(qdd)qdd.onchange=()=>{S.opt.qdd=qdd.value};
  const qa=app.querySelector("#qdayall");if(qa)qa.onclick=e=>qDayShare(S.opt.qdd||todayR(),teamIds(),e.currentTarget);
  const q1=app.querySelector("#qday1");if(q1)q1.onclick=e=>qDayShare(S.opt.qdd||todayR(),S.opt.tm==="all"?teamIds():[S.opt.tm],e.currentTarget);
  const tc=app.querySelector("#tclose");if(tc)tc.onclick=()=>{S.opt.tm="";render()};
  const td=app.querySelector("#tdaily");if(td)td.onclick=()=>{const u=S.opt.tm;S.nav.push({t:"daily"});S.opt={du:u};render();scrollTo(0,0)};
}

/* A4 pages (794×1123 px), each one becomes one PDF page */
async function pagesPdf(pages,name,btn){
  let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
  if(!dl){toast("حفظ الملفات يعمل عند فتح التطبيق من رابطه");return}
  const lbl=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent="جاري التجهيز…"}
  try{await loadLibs();const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"p",unit:"mm",format:"a4"});const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
    for(let i=0;i<pages.length;i++){const c=await html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",useCORS:true});if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,W,H)}
    await dl.save({filename:name.replace(/[\\/:*?"<>|]/g,"-")+".pdf",data:pdf.output("blob")});toast("تم حفظ ملف PDF")}
  catch(e){if(!(e&&e.code==="declined"))toast("تعذّر إنشاء ملف PDF")}
  finally{if(btn){btn.disabled=false;btn.textContent=lbl}}
}

const monthOf=d=>(d||todayR()).slice(0,7);
const weekOf=d=>{const t=new Date((d||todayR())+"T12:00:00");t.setDate(t.getDate()-t.getDay());return "W"+t.toISOString().slice(0,10)};   // weeks start on Sunday
const perDays=k=>{if(k.startsWith("W")){const s=new Date(k.slice(1)+"T12:00:00");return Array.from({length:7},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return x.toISOString().slice(0,10)})}
  const [y,m]=k.split("-").map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>k+"-"+String(i+1).padStart(2,"0"))};

function targetsDaily(uid,date,role){

     ${(T.custs||[]).length?tb(["العميل","المندوب","الهدف","ملاحظة"],T.custs.map(c=>[`<b>${esc(c.name)}</b>`,esc(R(c.rep)?R(c.rep).name:""),fmt(c.amt),esc(c.note||"")])):""}

    const fol=L.filter(e=>(e.visits||[]).some(v=>v.d&&v.d>=w)).length;

   <div class="row"><div class="seg" role="group" aria-label="نوع التنبيه"><button data-af="all" aria-pressed="${f==="all"}">الكل</button><button data-af="buy" aria-pressed="${f==="buy"}">بدون طلب ${d.custDays} يوم (${nB})</button><button data-af="pay" aria-pressed="${f==="pay"}">بدون تحصيل ${d.custDays} يوم (${nP})</button></div></div>
   <div class="card">${rows.length?`<div class="tbl"><table><thead><tr><th>العميل</th>${many?"<th>المندوب</th>":""}<th>التصنيف</th><th class="n">أيام بدون طلب</th><th class="n">أيام بدون تحصيل</th><th class="n">الرصيد</th><th>التنبيه</th></tr></thead><tbody>
   ${rows.map(a=>`<tr class="${RCLS[a[7]]}"><td class="wrap"><b>${esc(a[1])}</b></td>${many?`<td>${esc(R(a[8]).name)}</td>`:""}<td>${esc(a[7])}</td><td class="n">${a[2]==null?"لم يشترِ هذه الفترة":a[2]}</td><td class="n">${a[3]==null?"—":a[3]}</td><td class="n">${fmt(a[4])}</td><td>${a[5]?'<span class="pill s-warn">بدون طلب</span> ':""}${a[6]?'<span class="pill s-bad">بدون تحصيل</span>':""}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">لا توجد تنبيهات.</div>'}
   <p class="small muted" style="margin:0">العميل: تنبيه إذا مر ${d.custDays} يوم بدون فاتورة، أو ${d.custDays} يوم بدون سداد وعليه رصيد. المندوب: تنبيه للمديرة ومدير المبيعات والنائب إذا مر ${d.repDays} أيام بدون بيع أو تحصيل. مرتبة من الأخطر.</p></div>`;
  box.querySelectorAll("[data-af]").forEach(b=>b.onclick=()=>{S.opt.af=b.dataset.af;render()});
}

i18nInit();
boot();
</script>
</body>
</html>
